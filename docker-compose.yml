version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: proactive-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - proactive-mongo-data:/data/db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=secret
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 10s
      retries: 5

  redis:
    image: redis:7.0-alpine
    container_name: proactive-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - proactive-redis-data:/data
    command: redis-server --appendonly yes --requirepass secret

volumes:
  proactive-mongo-data:
  proactive-redis-data:
