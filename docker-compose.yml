version: '3.8'

services:
  # --- YOUR NEW BACKEND SERVICE ---
  backend:
    build: . # Tells Docker to look for the Dockerfile in this folder
    container_name: proactive-backend-app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      # Notice: Instead of 'localhost', we use the service names 'mongodb' and 'redis'
      # because they are now communicating inside the Docker network!
      - MONGO_URI=mongodb://root:secret@mongodb:27017/proactive_db?authSource=admin
      - REDIS_URL=redis://:secret@redis:6379
      - PORT=5000
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_started

  mongodb:
    image: mongo:7.0
    container_name: proactive-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - proactive-mongo-data:/data/db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=secret
    # 1. Start Mongo as a replica set named "rs0"
    command: [ "--replSet", "rs0", "--bind_ip_all", "--port", "27017" ]
    healthcheck:
      # 2. Initiate the replica set if it hasn't been already
      test: |
        mongosh --port 27017 -u root -p secret --authenticationDatabase admin --eval "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] }).ok }"
      interval: 10s
      timeout: 10s
      retries: 5
  redis:
    image: redis:7.0-alpine
    container_name: proactive-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - proactive-redis-data:/data
    command: redis-server --appendonly yes --requirepass secret

volumes:
  proactive-mongo-data:
  proactive-redis-data:
